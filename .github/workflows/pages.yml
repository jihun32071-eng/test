# morning-brief/ 를 GitHub Pages 사이트 루트로 올립니다.
#
# 설치형 앱(PWA)은 서비스워커 때문에 https 가 필요합니다. 내려받은 파일을
# 더블클릭해서 여는 file:// 로는 "앱으로 설치"가 뜨지 않고, Pages 같은 https
# 주소에 올라가야 홈 화면에 붙습니다.
#
# ⚠️ 한 번만 해줘야 하는 설정:
#   Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로.
#   그 전까지는 마지막 배포 단계가 권한 오류로 실패합니다.
#
# 브랜치를 가리지 않고 morning-brief/ 가 바뀐 푸시마다 돕니다 — 이 앱이 아직
# 기본 브랜치에 없어도 배포되게 하려는 의도입니다. 한 번에 하나만 배포되도록
# concurrency 로 묶어뒀습니다.

name: 아침 브리핑 → Pages

on:
  push:
    paths:
      - "morning-brief/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: morning-brief
      - id: deploy
        uses: actions/deploy-pages@v4
