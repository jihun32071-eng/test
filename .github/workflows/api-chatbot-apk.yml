# API 챗봇(안드로이드)을 APK 로 빌드해서 릴리스에 올립니다.
#
# 소스는 api-chatbot/ 한 곳에 있고, 안드로이드 SDK 와 의존성은 러너가 매번
# 새로 받습니다. 저장소에는 생성물을 두지 않습니다.
#
# 받는 곳: https://github.com/<저장소>/releases/tag/api-chatbot
#
# API 키는 빌드에 넣지 않습니다 — 누구나 받을 수 있는 파일이라, 넣으면 키가
# 그대로 새어 나갑니다. 대신 앱을 처음 켤 때 각자 자기 키를 넣습니다.

name: API 챗봇 APK

on:
  push:
    paths:
      - 'api-chatbot/**'
      - '.github/workflows/api-chatbot-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 디버그 APK 빌드
        working-directory: api-chatbot
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: cp api-chatbot/app/build/outputs/apk/debug/app-debug.apk api-chatbot.apk

      - name: APK 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: api-chatbot-apk
          path: api-chatbot.apk
          if-no-files-found: error

      # 로그인 없이 폰 브라우저에서 바로 받을 수 있는 고정 링크.
      # api-chatbot 태그는 항상 최신 빌드를 가리킵니다.
      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view api-chatbot >/dev/null 2>&1 || gh release create api-chatbot \
            --title "API 챗봇 — 안드로이드 APK" \
            --notes "폰 브라우저에서 아래 api-chatbot.apk 를 눌러 받은 뒤 설치하세요. 설치하려면 폰 설정에서 '출처를 알 수 없는 앱 설치'를 허용해야 합니다. 서명이 없는 디버그 빌드입니다. 앱을 처음 켜면 Anthropic API 키를 넣는 칸이 나옵니다 — 키는 폰에만 저장됩니다. 이 태그는 항상 최신 빌드를 가리킵니다."
          gh release upload api-chatbot api-chatbot.apk --clobber
          echo "다운로드: https://github.com/${{ github.repository }}/releases/download/api-chatbot/api-chatbot.apk"
